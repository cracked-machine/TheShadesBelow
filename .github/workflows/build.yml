name: Build

on:
  push:
    branches: [ '**' ]  # Run on all branches
    tags: [ '*' ]        # Also run on any tag push (cuts a release)
  pull_request:
    branches: [ '**' ]  # Run on all branches
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [debug, release]
        target: [x86_64-linux-gnu, x86_64-w64-mingw32]
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          load: true
          tags: local:latest

      - name: Run build with ${{ matrix.build_type }} / ${{ matrix.target }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/srv -w /srv local /srv/scripts/build.sh ${{ matrix.build_type }} ${{ matrix.target }}

      - name: Archive Build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}-${{ matrix.build_type }}
          path: build-${{ matrix.target }}-${{ matrix.build_type }}/bin/*
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each build artifact
        run: |
          cd artifacts
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
